name: Bug report
description: Something in sogar does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before posting logs or flight-record lines, remove usernames,
        paths, hostnames and anything else you would not publish. **Security issues go to
        [a private advisory](https://github.com/RyZenoKelb/Sogar/security/advisories/new), not here.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo sogar watch
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sogar doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sogar version
      placeholder: sogar 0.3.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and hardware
      placeholder: macOS 15.1, Apple M3
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options: [Claude Code, Claude Desktop, Cursor, Codex, Windsurf, aider, goose, Other / none]
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (redacted)
      render: text
